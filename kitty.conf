# ─────────────────────────────────────────
#  FONT
# ─────────────────────────────────────────
font_family      JetBrains Mono Bold
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Bold Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        13.0

# ─────────────────────────────────────────
#  CURSOR
# ─────────────────────────────────────────
cursor                  #ff6e6e
cursor_text_color       #ffffff
cursor_shape            beam
cursor_beam_thickness   1.8
cursor_blink_interval   0.5
cursor_stop_blinking_after 0

# Cursor trail (смазывание при движении)
cursor_trail            3
cursor_trail_decay      0.1 0.4

# ─────────────────────────────────────────
#  COLORS — Catppuccin Mocha base
# ─────────────────────────────────────────
# Фон — чёрный с лёгким серым оттенком
background              #1a1a1f
# Текст — белый с едва заметной серостью
foreground              #d4d4d8

# Selection
selection_background    #45475a
selection_foreground    #cdd6f4

# Catppuccin Mocha terminal colors
# Black
color0  #45475a
color8  #585b70

# Red
color1  #f38ba8
color9  #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #f5c2e7
color13 #f5c2e7

# Cyan
color6  #94e2d5
color14 #94e2d5

# White
color7  #bac2de
color15 #a6adc8

# ─────────────────────────────────────────
#  OPACITY & BLUR
# ─────────────────────────────────────────
background_opacity      0.85
background_blur         32
dynamic_background_opacity yes

# ─────────────────────────────────────────
#  WINDOW
# ─────────────────────────────────────────
window_padding_width    12
hide_window_decorations yes
remember_window_size    yes

# ─────────────────────────────────────────
#  MISC
# ─────────────────────────────────────────
enable_audio_bell       no
visual_bell_duration    0.0
scrollback_lines        10000
repaint_delay           8
input_delay             2
sync_to_monitor         yes
